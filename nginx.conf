# ==============================================================================
# AYAZ MÜHENDİSLİK - Nginx Production Server Configuration
# ==============================================================================
# Bu dosyayı /etc/nginx/sites-available/ayazmuhendislik.com olarak kaydedin
# ve 'alanadiniz.com' kısmını kendi tescilli alan adınızla değiştirin.
# ==============================================================================

# HTTP - HTTPS'e Yönlendirme
server {
    listen 80;
    listen [::]:80;
    server_name ayazmuhendislik.net www.ayazmuhendislik.net;

    # Let's Encrypt Certbot challenge yolu
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tüm HTTP trafiğini HTTPS'e zorla
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Ana Canlı Sunucu Bloğu
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ayazmuhendislik.net www.ayazmuhendislik.net;

    # SSL Sertifika Yolları (Certbot otomatik oluşturur)
    ssl_certificate /etc/letsencrypt/live/ayazmuhendislik.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ayazmuhendislik.net/privkey.pem;

    # Modern SSL Güvenlik Ayarları
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Güvenlik Başlıkları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json image/svg+xml;

    # Max Yükleme Boyutu
    client_max_body_size 10M;

    # Statik Varlıklar Önbellekleme (Assets)
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API ve Ana Uygulama Proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Zaman aşımı limitleri
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
